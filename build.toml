# build.toml for cosmic
#
# Klonuje oficjalny superprojekt COSMIC Epoch (github.com/pop-os/cosmic-epoch,
# ~27 submodułów Rust) na oznaczonym tagu wydania, buduje go w trybie release
# przez `just`, i instaluje wynik do lokalnego katalogu stagingowego, który
# hpm kopiuje w całości do contents/.
#
# UWAGA: to nie jest lekki pakiet. Pełna budowa może zająć 30-90+ minut i
# kilka GB wolnego miejsca, w zależności od sprzętu i tego, ile crate'ów
# Cargo trzeba pobrać/skompilować od zera. `just build` / `just install`
# to oficjalne komendy udokumentowane w justfile projektu — jeśli upstream
# zmieni nazwy recept, dopasuj poniższe komendy.
#
# sandbox.network musi być => true w info.hk, bo ten krok realnie potrzebuje
# sieci (git clone submodułów + pobieranie crate'ów przez cargo).

type = "build"

commands = [
    "git clone --recurse-submodules --depth 1 --branch epoch-1.4.0 https://github.com/pop-os/cosmic-epoch.git _src",
    "cd _src && just build",
    "cd _src && just rootdir=\"$(pwd)/../_install\" install",
]

# `output` wskazuje na KATALOG (nie pojedynczy plik) — hpm kopiuje całe
# drzewo (bin/, share/...) do contents/, więc wszystkie ~11 binariów COSMIC
# oraz zasoby (.desktop, ikony, schematy komponentów) trafiają na miejsce
# jedną komendą, bez wypisywania każdego pliku z osobna.
output = "_install"

build_deps = [
    "rustc",
    "cargo",
    "just",
    "pkg-config",
    "clang",
    "mold",
    "libwayland-dev",
    "libxkbcommon-dev",
    "libinput-dev",
    "libudev-dev",
    "libseat-dev",
    "libgbm-dev",
    "libdrm-dev",
    "libegl1-mesa-dev",
    "libgles2-mesa-dev",
    "libfontconfig1-dev",
    "libfreetype6-dev",
    "libpixman-1-dev",
    "libsystemd-dev",
    "libdbus-1-dev",
    "libpulse-dev",
    "libpipewire-0.3-dev",
    "libpolkit-agent-1-dev",
    "libexpat1-dev",
    "libzstd-dev",
]
runtime_deps = [
    "libwayland-client0",
    "libxkbcommon0",
    "libinput10",
    "libudev1",
    "libseat1",
    "libgbm1",
    "libdrm2",
    "libegl1",
    "libgles2",
    "libfontconfig1",
    "libpixman-1-0",
    "libsystemd0",
    "libdbus-1-3",
    "libpulse0",
    "libpipewire-0.3-0",
    "polkitd",
    "mesa-vulkan-drivers",
]

[env]
CARGO_NET_GIT_FETCH_WITH_CLI = "true"
